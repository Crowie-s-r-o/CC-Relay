apiVersion: v1
kind: ConfigMap
metadata:
  name: vibeide-proxy
  namespace: vibeide-dev
  labels: {app: vibeide}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes 1;
    error_log /dev/stderr warn;
    events { worker_connections 512; }
    http {
      access_log off;
      server_tokens off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      client_max_body_size 32k;
      client_body_timeout 10s;
      client_header_timeout 10s;
      keepalive_timeout 15s;
      limit_req_zone $binary_remote_addr zone=requests:10m rate=10r/s;
      limit_conn_zone $binary_remote_addr zone=connections:10m;
      server {
        listen 8443 ssl;
        server_name vibeide.dev www.vibeide.dev localhost;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        # Only the host's TLS terminator may supply client identity.
        set_real_ip_from 144.76.107.210;
        set_real_ip_from 10.244.0.1;
        real_ip_header X-Real-IP;
        limit_req zone=requests burst=30 nodelay;
        limit_req_status 429;
        limit_conn connections 20;
        location / {
          proxy_pass http://127.0.0.1:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header Connection "";
          proxy_http_version 1.1;
          proxy_connect_timeout 5s;
          proxy_read_timeout 35s;
        }
      }
    }
