# Install only after DNS points at this server and a public certificate exists.
# Private upstream CA: install vibeide-tls/tls.crt at the path below.
server {
    listen 80;
    server_name vibeide.dev www.vibeide.dev;
    access_log off;
    location / { return 301 https://vibeide.dev$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.vibeide.dev;
    ssl_certificate /etc/letsencrypt/live/vibeide.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibeide.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    return 301 https://vibeide.dev$request_uri;
}
server {
    listen 443 ssl;
    server_name vibeide.dev;
    ssl_certificate /etc/letsencrypt/live/vibeide.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibeide.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 32k;
    location / {
        proxy_pass https://10.98.39.77:443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/vibeide-internal-ca.crt;
        proxy_ssl_server_name on;
        proxy_ssl_name vibeide.dev;
        proxy_set_header Host vibeide.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 35s;
    }
}
