name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run desktop:build:mac
          - os: windows-latest
            command: npm run desktop:build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # CC Relay is validated on macOS only. The suite simulates Windows paths, shims, and
      # cmd.exe invocation from POSIX, so those cases fail on a real Windows runner and used to
      # skip the release job through `needs: build`. macOS gates correctness here and in ci.yml;
      # the Windows job stays as packaging verification.
      - if: runner.os == 'macOS'
        run: npm test
      - run: ${{ matrix.command }}
      # The macOS build remains packaging validation. Public macOS artifacts are built with the
      # maintainer's continuity identity, verified, and uploaded by npm run deploy. Publishing the
      # unsigned hosted-runner bundle would make Squirrel.Mac reopen the old application.
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: cc-relay-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm run release:check -- --tag "$GITHUB_REF_NAME"
      - run: npm run release:notes -- "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: cc-relay-Windows
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          body_path: release-notes.md
          fail_on_unmatched_files: true
