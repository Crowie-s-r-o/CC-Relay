name: Build desktop apps
run-name: Build desktop apps for ${{ inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to recover with the current workflow
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-target.outputs.result }}
    steps:
      - id: release-target
        uses: actions/github-script@v9
        with:
          script: |
            const requested = String(context.payload?.inputs?.release_tag || '');
            const tag = requested || context.ref.replace('refs/tags/', '');
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`Release target must be a stable vX.Y.Z tag, found ${tag || 'empty input'}.`);
            }
            const response = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
            });
            if (response.data.object.type !== 'tag') {
              throw new Error(`Release target ${tag} must be an annotated tag.`);
            }
            return tag;
          result-encoding: string

  build:
    needs: target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: npm run desktop:build:mac
          - os: windows-latest
            command: npm run desktop:build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # v0.2.30 was pushed with Windows builder peers missing from package-lock.json. A recovery
      # dispatch repairs only that detached checkout, then proves the repaired lock with the same
      # strict install used for every normal tag. The published tag and its source stay unchanged.
      - if: github.event_name == 'workflow_dispatch' && needs.target.outputs.tag == 'v0.2.30'
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps=false
      - run: npm ci --legacy-peer-deps=false
      # CC Relay is validated on macOS only. The suite simulates Windows paths, shims, and
      # cmd.exe invocation from POSIX, so those cases fail on a real Windows runner and used to
      # skip the release job through `needs: build`. macOS gates correctness here and in ci.yml;
      # the Windows job stays as packaging verification.
      - if: runner.os == 'macOS'
        run: npm test
      - run: ${{ matrix.command }}
      # The macOS build remains packaging validation. Public macOS artifacts are built with the
      # maintainer's continuity identity, verified, and uploaded by npm run deploy. Publishing the
      # unsigned hosted-runner bundle would make Squirrel.Mac reopen the old application.
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: cc-relay-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    needs: [target, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ needs.target.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm run release:check -- --tag "${{ needs.target.outputs.tag }}"
      - run: npm run release:notes -- "${{ needs.target.outputs.tag }}" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          pattern: cc-relay-Windows
          path: dist
          merge-multiple: true
      - id: release-state
        uses: actions/github-script@v9
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const tag = String(context.payload?.inputs?.release_tag || '')
              || context.ref.replace('refs/tags/', '');
            const existing = releases.find((release) => release.tag_name === tag);
            const version = tag.startsWith('v') ? tag.slice(1) : '';
            const expected = [
              `CC-Relay-${version}-mac-arm64.dmg`,
              `CC-Relay-${version}-mac-arm64.dmg.blockmap`,
              `CC-Relay-${version}-mac-arm64.zip`,
              `CC-Relay-${version}-mac-arm64.zip.blockmap`,
              `CC-Relay-${version}-win-x64-Portable.exe`,
              `CC-Relay-${version}-win-x64-Setup.exe`,
              `CC-Relay-${version}-win-x64-Setup.exe.blockmap`,
              'latest-mac.yml',
              'latest.yml',
              'mac-release.json',
            ];
            const uploaded = new Set((existing?.assets || [])
              .filter((asset) => asset.state === 'uploaded' && asset.size > 0)
              .map((asset) => asset.name));
            if (existing && !existing.draft && expected.every((name) => uploaded.has(name))) {
              return 'published-complete';
            }
            return existing ? (existing.draft ? 'draft' : 'published-incomplete') : 'missing';
          result-encoding: string
      # A rerun for an already complete tag must not replace live updater assets. Missing, draft,
      # and legacy incomplete releases remain resumable through the guarded local deploy handoff.
      - if: steps.release-state.outputs.result != 'published-complete'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.target.outputs.tag }}
          # Keep the release invisible to desktop updaters until local deploy has uploaded and
          # verified every signed macOS payload. Local deploy publishes the complete draft.
          draft: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          body_path: release-notes.md
          fail_on_unmatched_files: true
