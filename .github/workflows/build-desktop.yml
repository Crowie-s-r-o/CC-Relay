name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: npm run desktop:build:mac
          - os: windows-latest
            command: npm run desktop:build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ runner.os }}
          path: dist/*
