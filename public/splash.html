<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
    <title>CC Relay is starting</title>
    <link rel="stylesheet" href="./splash.css">
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite" aria-label="CC Relay is starting">
      <img class="splash-mark" src="./favicon.svg" alt="" aria-hidden="true">
      <h1 class="splash-wordmark">CC Relay</h1>
      <p class="splash-tagline">AI work, one task at a time</p>
      <div class="splash-progress" aria-hidden="true">
        <span class="splash-seg"></span>
        <span class="splash-seg"></span>
        <span class="splash-seg"></span>
        <span class="splash-seg"></span>
        <span class="splash-seg"></span>
        <span class="splash-seg"></span>
      </div>
      <p class="splash-status">
        <span class="splash-status-live"><i class="splash-dot" aria-hidden="true"></i>Starting</span>
        <span class="splash-status-note">Starting local server</span>
      </p>
      <p class="splash-credit">Created by software development company Crowie s.r.o.</p>
    </main>
  </body>
</html>
