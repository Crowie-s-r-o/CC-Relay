<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'">
    <title>CC Relay is starting</title>
    <link rel="stylesheet" href="./splash.css">
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite" aria-label="CC Relay is starting">
      <div class="signal-field" aria-hidden="true">
        <span class="signal-ring signal-ring-outer"></span>
        <span class="signal-ring signal-ring-inner"></span>
        <span class="signal-orbit"><i></i></span>
        <span class="mark-stage">
          <img src="./favicon.svg" alt="">
        </span>
      </div>

      <section class="splash-copy">
        <p class="splash-eyebrow">Software by Crowie s.r.o.</p>
        <h1><span>CC</span> Relay</h1>
        <p class="splash-company">Software Development company</p>
      </section>

      <div class="startup-state">
        <span class="startup-state-label">Preparing your command center</span>
        <span class="startup-track" aria-hidden="true"><i></i></span>
      </div>

      <footer>
        <span>Local AI orchestration</span>
        <span aria-hidden="true">Codex + Claude</span>
      </footer>
    </main>
  </body>
</html>
