appId: com.relay.queue
productName: CC Relay
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
generateUpdatesFilesForAllChannels: true
files:
  - src/**/*
  - public/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
mac:
  category: public.app-category.developer-tools
  icon: icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: CC Relay uses the microphone only while you hold push-to-talk to transcribe a task prompt locally.
  target:
    - dmg
    - zip
win:
  icon: icon.png
  target:
    - nsis
    - portable
dmg:
  backgroundColor: "#e8eaef"
  icon: null
  iconSize: 96
  iconTextSize: 13
  title: CC Relay
  window:
    width: 640
    height: 380
  contents:
    - x: 160
      y: 190
      type: file
    - x: 480
      y: 190
      type: link
      path: /Applications
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: CC-Relay-${version}-${os}-${arch}-Setup.${ext}
portable:
  artifactName: CC-Relay-${version}-${os}-${arch}-Portable.${ext}
artifactName: CC-Relay-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: Crowie-s-r-o
  repo: CC-Relay
  releaseType: release
